[package]
name = "minisgl"
version = "0.1.0"
edition = "2021"
authors = ["SGLang Team / Mini-SGLang Rust Authors"]
description = "High-performance LLM inference engine in pure Rust"
readme = "README.md"
license = "MIT"

[dependencies]
# Async Runtime & Web Server
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["json", "tokio"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI & Utilities
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
rand = "0.9"
half = { version = "2.4", features = ["serde", "num-traits"] }
num-traits = "0.2"

# Tokenization & HF Models
tokenizers = "0.21"
hf-hub = "0.4"
safetensors = "0.5"

# Tensor Runtime & CUDA
candle-core = { version = "0.9", default-features = false }
candle-nn = { version = "0.9", default-features = false }
cudarc = { version = "0.12", optional = true, features = ["nvrtc", "cublas", "nccl"] }
cutile = { version = "0.4", optional = true }
cuda-oxide = { version = "0.4", optional = true }

[features]
default = ["cuda", "cutile", "cuda-oxide"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:cudarc"]
cutile = ["dep:cutile"]
cuda-oxide = ["dep:cuda-oxide"]

[patch.crates-io]
zip = { path = "vendor/zip" }

[[bin]]
name = "minisgl"
path = "src/main.rs"

[lib]
name = "minisgl"
path = "src/lib.rs"
